<title>Wave Mini-Wörterbuch · Caminos 1</title>
<style>
  :root {
    --bg: #04141f; --surface: #072233; --surface2: #0d3047; --surface3: #143d57;
    --accent: #38c9b0; --accent2: #7ee8d8;
    --text: #e8f4f8; --text2: #7eb8cc; --text3: #3d7a8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'DM Sans', -apple-system, Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); padding: 20px 20px 14px; border-bottom: 1px solid var(--surface3);
  }
  h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: 0.5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--text3); font-size: 13px; margin-bottom: 14px; }
  input#search {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--surface3);
    background: var(--surface); color: var(--text); font-size: 16px; outline: none;
  }
  input#search:focus { border-color: var(--accent); }
  #count { color: var(--text3); font-size: 12px; margin-top: 8px; }
  main { padding: 8px 20px 60px; max-width: 720px; margin: 0 auto; }
  .letter {
    color: var(--accent); font-family: 'DM Serif Display', serif; font-size: 20px;
    margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--surface2);
  }
  .entry {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 10px; border-radius: 10px; gap: 12px;
  }
  .entry:hover { background: var(--surface); }
  .de { color: var(--text); font-size: 15px; }
  .es { color: var(--accent2); font-size: 15px; text-align: right; font-style: italic; }
  .chapter { color: var(--text3); font-size: 11px; margin-left: 6px; font-style: normal; }
  .empty { text-align: center; color: var(--text3); padding: 40px 0; }

  .burger-btn{position:fixed;top:16px;right:16px;z-index:200;width:42px;height:42px;
    border-radius:12px;background:var(--surface2);border:1px solid var(--surface3);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;
    color:var(--text2);transition:background .15s}
  .burger-btn:active{background:var(--surface3)}
  .menu-overlay{position:fixed;inset:0;background:rgba(4,20,31,.72);z-index:199;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .menu-overlay.open{opacity:1;pointer-events:auto}
  .menu-drawer{position:fixed;top:0;right:0;height:100%;width:78%;max-width:300px;
    background:var(--surface);border-left:1px solid var(--surface3);z-index:200;
    transform:translateX(100%);transition:transform .25s ease;
    padding:70px 18px 24px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
  .menu-drawer.open{transform:translateX(0)}
  .menu-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;
    background:var(--surface2);border:1px solid var(--surface3);color:var(--text2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
  .menu-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent2);
    margin-bottom:10px;padding:0 4px}
  .menu-link{display:flex;align-items:center;gap:12px;padding:14px 14px;background:var(--surface2);
    border-radius:var(--radius-sm,12px);color:var(--text);text-decoration:none;
    font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif}
  .menu-link:active{background:var(--surface3)}
  .menu-link.active{border:1px solid var(--accent);color:var(--accent2)}
  .menu-link .emoji{font-size:18px}
</style>
</head>

function norm(s) {
  return s.toLowerCase()
    .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss')
    .replace(/á|à/g,'a').replace(/é|è/g,'e').replace(/í|ì/g,'i').replace(/ó|ò/g,'o').replace(/ú|ù/g,'u').replace(/ñ/g,'n');
}

const results = document.getElementById('results');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');

function render(filter) {
  const f = norm(filter.trim());
  let filtered = DATA;
  if (f.length > 0) {
    filtered = DATA.filter(v => norm(v.de).includes(f) || norm(v.es).includes(f));
  }
  countEl.textContent = filtered.length + ' Treffer';
  if (filtered.length === 0) {
    results.innerHTML = '<div class="empty">Kein Eintrag gefunden.</div>';
    return;
  }
  let html = '';
  let lastLetter = '';
  for (const v of filtered) {
    const letter = v.sortkey.charAt(0).toUpperCase();
    if (letter !== lastLetter) {
      html += `<div class="letter">${letter}</div>`;
      lastLetter = letter;
    }
    html += `<div class="entry"><span class="de">${v.de}</span><span class="es">${v.es}<span class="chapter">${v.chapter}</span></span></div>`;
  }
  results.innerHTML = html;
}

searchEl.addEventListener('input', () => render(searchEl.value));
render('');
